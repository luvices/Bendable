name: Build

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pin when the runner image offers it, otherwise use whatever is default.
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Run tests
        run: scripts/test.sh

      - name: Build Release
        run: scripts/build.sh
        env:
          CONFIGURATION: Release

      - name: Package DMG
        run: scripts/package-dmg.sh

      - name: Verify the app has no network entitlement
        run: |
          codesign -d --entitlements - --xml build/Bendable.app 2>/dev/null > entitlements.xml || true
          if grep -q "network" entitlements.xml; then
            echo "::error::A network entitlement was found in the built app"
            cat entitlements.xml
            exit 1
          fi
          echo "No network entitlement present"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Bendable-${{ github.sha }}
          path: |
            build/releases/Bendable.dmg
            build/releases/Bendable.dmg.sha256
          if-no-files-found: error
          retention-days: 30
