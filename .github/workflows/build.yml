name: Build macOS DMG

on:
  push:
    branches: ['**']
    tags-ignore: ['v*.*.*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Pin when the runner image offers it, otherwise use whatever is default.
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version
          sw_vers
          uname -m

      - name: Run tests
        run: scripts/test.sh

      - name: Build Release
        run: scripts/build.sh
        env:
          CONFIGURATION: Release
          ARCHS: arm64

      - name: Check signing configuration
        id: signing-config
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [[ -n "$CERTIFICATE" && -n "$CERTIFICATE_PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" && -n "$NOTARY_TEAM_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Developer ID credentials are incomplete; using the project's ad-hoc signing."
          fi

      - name: Import Developer ID certificate
        if: steps.signing-config.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign, notarize and package DMG
        if: steps.signing-config.outputs.ready == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/notarize.sh

      - name: Package ad-hoc signed DMG
        if: steps.signing-config.outputs.ready != 'true'
        run: scripts/package-dmg.sh

      - name: Verify Metal shaders and DMG output
        run: |
          test -n "$(find build/Bendable.app -name '*.metallib' -print -quit)" || { echo "::error::Compiled Metal library missing"; exit 1; }
          test -f build/releases/Bendable.dmg || { echo "::error::DMG missing"; exit 1; }
          hdiutil verify build/releases/Bendable.dmg

      - name: Verify the app has no network entitlement
        run: |
          codesign -d --entitlements - --xml build/Bendable.app 2>/dev/null > entitlements.xml || true
          if grep -q "network" entitlements.xml; then
            echo "::error::A network entitlement was found in the built app"
            cat entitlements.xml
            exit 1
          fi
          echo "No network entitlement present"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Bendable-macOS-AppleSilicon
          path: build/releases/Bendable.dmg
          if-no-files-found: error
          retention-days: 30
