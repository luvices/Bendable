name: Release

# Releases follow the version in the Xcode project rather than a tag pushed by hand.
# Bump MARKETING_VERSION, push, and this publishes. Every other push to main costs
# one cheap Linux job that looks at the version and stops.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are how this knows what has already gone out.
          fetch-depth: 0

      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(scripts/version.sh)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released. Bump MARKETING_VERSION to publish again."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, package and publish
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    # Lifted to the job so the steps below can ask whether signing is configured.
    # `secrets` is not one of the contexts an `if` can read; `env` is.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      VERSION: ${{ needs.decide.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Run tests
        run: scripts/test.sh

      - name: Build Release
        run: scripts/build.sh
        env:
          CONFIGURATION: Release

      # Signing and notarization are optional. Without the secrets the job still
      # produces a working, ad-hoc signed DMG. It just shows Gatekeeper's
      # unidentified-developer prompt on first launch.
      - name: Import signing certificate
        id: signing
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and package
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/notarize.sh

      - name: Package DMG (unsigned)
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: scripts/package-dmg.sh

      # The action creates the tag at this commit when it does not exist yet, which
      # is what makes a version bump enough on its own.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Bendable ${{ env.VERSION }}
          draft: false
          generate_release_notes: true
          files: |
            build/releases/Bendable.dmg
            build/releases/Bendable.dmg.sha256
