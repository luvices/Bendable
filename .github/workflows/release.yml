name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish
    runs-on: macos-15
    timeout-minutes: 45

    # Lifted to the job so the steps below can ask whether signing is configured.
    # `secrets` is not one of the contexts an `if` can read; `env` is.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -switch /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Run tests
        run: scripts/test.sh

      - name: Build Release
        run: scripts/build.sh
        env:
          CONFIGURATION: Release

      # Signing and notarization are optional. Without the secrets the job still
      # produces a working, ad-hoc signed DMG. It just shows Gatekeeper's
      # unidentified-developer prompt on first launch.
      - name: Import signing certificate
        id: signing
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and package
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: scripts/notarize.sh

      - name: Package DMG (unsigned)
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: scripts/package-dmg.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            build/releases/Bendable.dmg
            build/releases/Bendable.dmg.sha256
